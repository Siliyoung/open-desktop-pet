[package]
name = "open-desktop-pet"
version = "0.2.4"
description = "A tiny open-source desktop companion"
authors = ["Open Desktop Pet contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "open_desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
